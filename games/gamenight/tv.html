<!doctype html>
<html lang="en" class="tv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Night · TV</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <main id="app"></main>
  <div id="corner-join" class="corner-join"></div>
  <div id="controls" class="controls">
    <button class="game-only" data-host="addTime" title="Give everyone 30 more seconds">+30s</button>
    <button class="game-only" data-host="skip" title="Skip to the next screen">Next ⏭</button>
    <button class="game-only" id="end-game" title="End this game and go back to the lobby">End game</button>
    <button id="mute" title="Sound on/off">🔊</button>
    <button id="fullscreen" title="Full screen (or press F11)">⛶</button>
  </div>
  <!-- QR code library; the lobby still works without it (players can type the room code). -->
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
    onload="window.dispatchEvent(new Event('qr-ready'))"></script>
  <script src="common.js"></script>
  <script src="content.js"></script>
  <script src="engine.js"></script>
  <script src="host.js"></script>
</body>
</html>
